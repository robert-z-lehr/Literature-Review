name: Scheduled Research Email Reminder

on:
  schedule:
    # Runs every Monday at 13:00 UTC.
    # This is 8:00 AM during U.S. Central Daylight Time and 7:00 AM during Central Standard Time.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      subject:
        description: "Email subject"
        required: false
        default: "Weekly PhD research reminder"
      message:
        description: "Reminder message body"
        required: false
        default: "Review Literature-Review tasks, update source notes, and choose the next research deliverable."

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Send reminder email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REMINDER_EMAIL_FROM: ${{ secrets.REMINDER_EMAIL_FROM }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
          DISPATCH_SUBJECT: ${{ github.event.inputs.subject }}
          DISPATCH_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from datetime import datetime, timezone

          required = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "REMINDER_EMAIL_FROM",
              "REMINDER_EMAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required repository secret(s): {', '.join(missing)}")

          subject = os.environ.get("DISPATCH_SUBJECT") or "Weekly PhD research reminder"
          message = os.environ.get("DISPATCH_MESSAGE") or "Review Literature-Review tasks, update source notes, and choose the next research deliverable."

          body = f"""{message}

Repository: https://github.com/robert-z-lehr/Literature-Review
Live site: https://robert-z-lehr.github.io/Literature-Review/

Suggested weekly check:
1. Add or clean one source note.
2. Update one evidence-matrix row.
3. Move one draft section forward.
4. Log next action in the PhD Research Roadmap.

Generated by GitHub Actions at {datetime.now(timezone.utc).isoformat()}.
"""

          email = EmailMessage()
          email["Subject"] = subject
          email["From"] = os.environ["REMINDER_EMAIL_FROM"]
          email["To"] = os.environ["REMINDER_EMAIL_TO"]
          email.set_content(body)

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])

          with smtplib.SMTP(smtp_host, smtp_port) as server:
              server.starttls()
              server.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              server.send_message(email)

          print("Reminder email sent.")
          PY
